<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GoExplore</title>
    <script>
        (function () {
            var stored = localStorage.getItem('goexplore-theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header">
            <img class="brand-mark" src="./src/assets/appicon.png" alt=""/>
            <div class="brand-copy">
                <span class="brand-name">GoExplore</span>
                <span id="app-version"></span>
            </div>
        </div>
        <div class="sidebar-label">Places</div>
        <div class="conn-list" id="conn-list"></div>
        <div class="sidebar-footer">
            <button class="btn" type="button" onclick="openConnModal()">Add connection</button>
            <button class="btn btn-quiet btn-icon" id="theme-toggle" type="button" onclick="toggleTheme()" title="Switch to light mode" aria-label="Switch to light mode">
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            </button>
        </div>
    </aside>

    <div id="main-area">
        <div id="toolbar">
            <div class="nav-cluster">
                <button class="btn btn-quiet btn-icon" type="button" title="Up" onclick="navigateUp()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                </button>
                <div id="breadcrumb">/</div>
            </div>
            <div class="action-bar">
                <div class="upload-wrap">
                    <button class="btn btn-quiet" type="button" onclick="toggleUploadMenu(event)">Upload</button>
                    <div id="upload-menu" class="context-menu" style="display: none;">
                        <div class="menu-item" onclick="promptUploadFiles(); toggleUploadMenu()">Files</div>
                        <div class="menu-item" onclick="promptUploadDirectory(); toggleUploadMenu()">Folder</div>
                    </div>
                </div>
                <button class="btn btn-quiet" type="button" onclick="refreshCurrentDir()">Refresh</button>
                <button class="btn" id="transfers-btn" type="button" onclick="showTransfers()">Transfers (0)</button>
            </div>
        </div>
        <div id="browser-pane">
            <table>
                <thead>
                    <tr>
                        <th onclick="setSort('name')">Name <span id="sort-ind-name">↑</span></th>
                        <th onclick="setSort('size')">Size <span id="sort-ind-size"></span></th>
                        <th onclick="setSort('modified')">Modified <span id="sort-ind-modified"></span></th>
                        <th onclick="setSort('permissions')">Permissions <span id="sort-ind-permissions"></span></th>
                    </tr>
                </thead>
                <tbody id="file-list"></tbody>
            </table>
        </div>
        <div id="transfer-tray">
            <div class="tray-header">
                <h3>Transfers</h3>
                <div class="tray-actions">
                    <button class="btn btn-quiet" type="button" onclick="clearTransfers()">Clear finished</button>
                    <button class="btn btn-quiet" type="button" onclick="hideTransfers()">Close</button>
                </div>
            </div>
            <div id="transfer-list"></div>
        </div>
    </div>

    <div id="conn-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Add connection</h2>
            <form id="conn-form">
                <input type="hidden" id="conn-id">

                <div class="form-group">
                    <label for="conn-name">Name</label>
                    <input type="text" id="conn-name" required placeholder="My Server">
                </div>

                <div class="form-group">
                    <label for="conn-protocol">Protocol</label>
                    <select id="conn-protocol" onchange="updateProtocolFields()">
                        <option value="s3">S3 / S3-compatible</option>
                        <option value="sftp">SFTP</option>
                        <option value="ftp">FTP</option>
                        <option value="webdav">WebDAV</option>
                        <option value="smb">SMB</option>
                        <option value="nfs">NFS</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 3;">
                        <label for="conn-host">Host</label>
                        <input type="text" id="conn-host" placeholder="example.com">
                    </div>
                    <div class="form-group" style="flex: 1;" id="port-group">
                        <label for="conn-port">Port</label>
                        <input type="number" id="conn-port" placeholder="22">
                    </div>
                </div>

                <div id="bucket-fields" style="display: none;">
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label id="bucket-label" for="conn-bucket">Bucket</label>
                            <input type="text" id="conn-bucket" placeholder="my-bucket-or-share">
                        </div>
                        <div class="form-group" style="flex: 1;" id="region-group">
                            <label for="conn-region">Region</label>
                            <input type="text" id="conn-region" placeholder="us-east-1">
                        </div>
                    </div>
                    <div class="form-group check-row" id="pathstyle-group">
                        <input type="checkbox" id="conn-pathstyle">
                        <label for="conn-pathstyle">Use path-style URLs</label>
                    </div>
                </div>

                <div class="form-group check-row" id="ftp-secure-group" style="display: none;">
                    <input type="checkbox" id="conn-secure">
                    <label for="conn-secure">Use FTPS (explicit TLS)</label>
                </div>

                <div class="form-row" id="auth-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="conn-username">Username / access key</label>
                        <input type="text" id="conn-username" placeholder="user">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <div class="secret-head">
                            <label id="secret-label" for="conn-secret">Password / secret key</label>
                            <select id="conn-sftp-auth-type" style="display: none;" onchange="updateProtocolFields()">
                                <option value="password">Password</option>
                                <option value="key">Private key</option>
                            </select>
                        </div>
                        <input type="password" id="conn-secret" placeholder="Stored in the OS keychain">
                        <textarea id="conn-secret-key" style="display: none;" rows="4" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-danger" id="conn-delete-btn" style="display: none; margin-right: auto;" onclick="deleteConnection()">Delete</button>
                    <button type="button" class="btn btn-quiet" onclick="closeConnModal()">Cancel</button>
                    <button type="submit" class="btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="context-menu" class="context-menu" style="display: none;">
        <div id="ctx-rename" class="menu-item" onclick="handleContextMenu('rename')">Rename</div>
        <div id="ctx-transfer" class="menu-item" onclick="handleContextMenu('transfer')">Transfer</div>
        <div id="ctx-download" class="menu-item" onclick="handleContextMenu('download')">Download</div>
        <div id="ctx-delete" class="menu-item menu-danger" onclick="handleContextMenu('delete')">Delete</div>
        <div id="ctx-divider" class="menu-divider"></div>
        <div class="menu-item" onclick="handleContextMenu('toggle_hidden')"><span id="ctx-hidden-text">Show hidden files</span></div>
    </div>

    <div id="transfer-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Select destination</h2>
            <div class="form-group">
                <label for="transfer-dest-conn">Connection</label>
                <select id="transfer-dest-conn" onchange="loadTransferDestRoot()"></select>
            </div>
            <div id="transfer-dest-breadcrumb" class="path-label">/</div>
            <div id="transfer-dest-browser" class="dest-browser">
                <table>
                    <tbody id="transfer-dest-list"></tbody>
                </table>
            </div>

            <div class="form-group check-row">
                <input type="checkbox" id="transfer-verify">
                <label for="transfer-verify">
                    Verify checksum (MD5)
                    <span class="hint">Slower for non-S3 destinations because the file is read again over the network.</span>
                </label>
            </div>

            <div class="speed-row">
                <label for="transfer-limit">Max speed (MB/s)</label>
                <input type="number" id="transfer-limit" value="0" min="0">
                <span class="hint">0 is unlimited</span>
            </div>

            <div class="modal-actions">
                <button class="btn btn-quiet" type="button" onclick="closeTransferModal()">Cancel</button>
                <button class="btn" type="button" onclick="executeTransfer()">Transfer here</button>
            </div>
        </div>
    </div>

    <script src="./src/main.js" type="module"></script>
</body>
</html>
